# manifest.json 的版本号变了（推到 main）时自动打包扩展，发布到 GitHub Releases。
# 这个版本已经发布过就跳过；也可以在 Actions 页面手动运行。
name: Release

on:
  push:
    branches: [main]
    paths: ['manifest.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          TAG="v$(jq -r .version manifest.json)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "$TAG already released, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip
        if: steps.ver.outputs.exists == 'false'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          mkdir -p dist/reply-copilot
          tar --exclude=./.git --exclude=./.github --exclude=./dist --exclude=./.gitignore -cf - . | tar -xf - -C dist/reply-copilot
          cd dist && zip -qr "reply-copilot-${TAG}.zip" reply-copilot

      - name: Release notes from README
        if: steps.ver.outputs.exists == 'false'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          awk -v v="## ${TAG} 更新" 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' README.md > notes.md
          cat >> notes.md <<'TXT'

          ### 安装
          1. 下载下面的 `reply-copilot-*.zip`，解压。
          2. Chrome 打开 `chrome://extensions`，右上角打开「开发者模式」。
          3. 点「加载已解压的扩展程序」，选解压出来的 `reply-copilot` 文件夹。
          4. 升级：解压新版本覆盖到同一个文件夹，在扩展页点刷新按钮。数据保存在浏览器里，不会丢。
          TXT

      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release create "$TAG" "dist/reply-copilot-${TAG}.zip" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Reply Copilot ${TAG}" --notes-file notes.md
